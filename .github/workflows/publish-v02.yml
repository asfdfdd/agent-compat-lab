name: Publish v0.2 tree
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize tested tree
        shell: bash
        run: |
          cat > /tmp/acl.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/acl.b64 > /tmp/acl.tar.gz
          tar -xzf /tmp/acl.tar.gz -C .
          rm -f .github/workflows/publish-v02.yml
      - name: Commit tested tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ship Agent Compat Lab v0.2"
          git push

